<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesión inventario adso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>

<body class="login-fondo">
    <!--Contenido principal de la pagina-->
    <main class="login-card">
        <!--Encabezado del login-->
        <header class="login-encabezado">
            <!--Icono de la tienda-->
            <i class="bi bi-android2 display-1 text-sicet"></i>
            <h1 style="color: darkblue;" class="h3 fw-bold">Registro de equipos</h1>
            <p class="text-secondary mb-0">Ingresa tus credenciales para continuar</p>
        </header>
        <form action="dashboard.html" method="get">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo"
                    placeholder="Usuario@correo.com" required>

                <label for="correo">
                    <i class="bi bi-envelope me-1"></i>
                    Usuario 
                </label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="clave" placeholder="Minimo 8 caracteres" minlength="8" required>
                <label for="clave"><i class="bi bi-lock me-1"></i>Contraseña</label>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="recordar">
                    <label style="color: purple;" class="form-check-label" for="recordar">Recordar</label>
                </div>
                <a style="color: purple;" href="#" class="small text-decoration-none">¿Olvido su contraseña?</a>
            </div>
            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                <i style="color: purple;" class="bi bi-box-arrow-in-right me-1"></i>Ingresar
            </button>

        </form>
        <p style="color: purple;" class="login-pie">¿No tiene cuenta? <a href="registro.html" style="color: red;" class="text-decoration-none">Regístrate</a></p>
        <footer class="login-pie" align="center"><font size="3" face="brush script mt" color="purple"> Sicet 2026</font>
        </footer>
    </main>
</body>
</html>

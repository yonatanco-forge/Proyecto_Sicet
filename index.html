<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-9">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesión inventario adso</title>
    
</head>

<body class="login-fondo">

    <main class="login-card">

        <header class="login-encabezado">
           
            <i class="bi bi-shop display-4 text-sicet"></i>

            <h1 class="h3 fw-bold">Registro de equipos</h1>

            <p class="text-secondary mb-0">
                Ingresa tus credenciales para continuar
            </p>
        </header>

        <form action="dashboard.html" method="get">

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="correo"
                    placeholder="Usuario@correo.com" required>

                <label for="correo">
                    <i class="bi bi-envelope me-1"></i>
                    Usuario 
                </label>
            </div>

            <div class="form-floating mb-3">

                <input type="password" class="form-control" id="clave"
                    placeholder="Minimo 8 caracteres"
                    minlength="8" required>

                <label for="clave">
                    <i class="bi bi-lock me-2"></i>
                    Contraseña
                </label>

            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check">

                    <input class="form-check-input" type="checkbox" id="recordar">

                    <label class="form-check-label" for="recordar">
                        Recordar
                    </label>

                </div>

                <a href="#" class="small text-decoration-none">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

            <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Ingresar
            </button>

        </form>

        <p class="login-pie">
            ¿No tienes cuenta?
            <a href="registro.html" class="text-decoration-none">Regístrate</a>
        </p>

        <footer class="login-pie">
            Sicet 2026
        </footer>

    </main>

</body>
</html>
